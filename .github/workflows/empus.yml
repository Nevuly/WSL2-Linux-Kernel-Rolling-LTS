name: LTS EMPUS Kernel CI

on:
  push:
    tags:
      - 'linux-wsl-lts-6.1.[0-9]+-empus-[0-9]+'
      - 'linux-wsl-lts-6.1.[0-9]+-empus-[0-9]+.[0-9]+'

run-name: LTS EMPUS Build ${{ github.ref_name }}

jobs:
  call-core-workflow:
    name: LTS EMPUS Kernel Build
    uses: Nevuly/excavator/.github/workflows/excavator.yml@master
    with:
      tag_name: ${{ github.ref_name }}
      build_type: lts-empus
      build_rt: false
      build_zfs: true
      is_release: false
    secrets: inherit
